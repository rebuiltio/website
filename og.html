<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..500&display=swap" />
  <style>
    /* 1200x630 Open Graph card. Same DS-mirrored tokens as index.html. Dark by design. */
    :root {
      color-scheme: dark;
      --color-bg: oklch(13.0% 0.010 264);
      --color-text: oklch(95.0% 0.010 264);
      --color-border: oklch(28.0% 0.016 264);
      --color-computer-fg: oklch(82.0% 0.140 265);
      --color-computer: oklch(68.0% 0.180 265);
      --color-human-fg: oklch(85.0% 0.140 85);
      --color-human: oklch(82.0% 0.160 85);
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; }
    body {
      font-family: var(--font-display);
      background: var(--color-bg);
      color: var(--color-text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 72px 88px;
    }
    .mark { font-size: 30px; font-weight: 500; letter-spacing: -0.01em; }
    h1 {
      font-size: 78px;
      font-weight: 300;
      line-height: 1.02;
      letter-spacing: -0.03em;
      max-width: 15ch;
      font-variation-settings: "opsz" 144;
    }
    .line { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; font-size: 27px; line-height: 1.3; }
    .line span { padding-top: 20px; border-top: 3px solid var(--rule); }
    .line .c { color: var(--color-computer-fg); --rule: var(--color-computer); }
    .line .h { color: var(--color-human-fg); --rule: var(--color-human); }
  </style>
</head>
<body>
  <div class="mark">Rebuilt Health</div>
  <h1>The autonomous back office for health insurance brokers.</h1>
  <div class="line">
    <span class="c">The computer work goes to the computers.</span>
    <span class="h">The human work stays with the humans.</span>
  </div>
</body>
</html>
