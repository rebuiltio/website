<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    /* 1200x630 Open Graph card — same brand tokens as index.html */
    :root {
      --color-bg: #0d1117;
      --color-surface: #161b22;
      --color-text: #e6edf3;
      --color-text-muted: #9198a1;
      --color-border: #30363d;
      --color-accent-300: #66a1ff;
      --color-accent-400: #3381ff;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; }
    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
      -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(1000px 600px at 50% -18%, rgba(31, 111, 235, 0.18), transparent 70%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 96px;
    }
    .mark { font-weight: 700; font-size: 30px; letter-spacing: -0.01em; margin-bottom: 40px; }
    .mark .dot { color: var(--color-accent-400); }
    h1 {
      font-size: 76px;
      line-height: 1.06;
      letter-spacing: -0.02em;
      font-weight: 700;
      max-width: 18ch;
    }
    h1 .accent { color: var(--color-accent-300); }
    .sub {
      margin-top: 36px;
      font-size: 26px;
      color: var(--color-text-muted);
      max-width: 46ch;
    }
  </style>
</head>
<body>
  <div class="mark">Rebuilt Health<span class="dot">.</span></div>
  <h1>The autonomous back office for <span class="accent">health insurance brokers</span>.</h1>
  <div class="sub">The computer work goes to the computers. The human work stays with the humans.</div>
</body>
</html>
